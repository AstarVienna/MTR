version: 2
updates:
  # Workflow actions are pinned to major tags; let Dependabot move them.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    ignore:
      # Pinned deliberately — see the comment in pyproject.toml. Relaxing this
      # needs a Wayland test, not a bot.
      - dependency-name: PyQt6
      - dependency-name: PyQt6-Qt6
