name: Refresh upstream snapshot

# Opens (or updates) a PR when METIS_Pipeline's workflows drift from the bundled
# snapshot, and merges it once the PR's Unit Tests (incl. the upstream contract) pass.
on:
  schedule:
    - cron: "0 4 * * 1,4"  # Mondays and Thursdays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate, open a PR and merge it
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: automation/upstream-snapshot
      SNAPSHOT: src/metis_test_runner/upstream_snapshot.json
    steps:
      # Needs secret SNAPSHOT_PR_TOKEN (a personal access token), whose PRs also
      # trigger the tests. Without it, GITHUB_TOKEN can only open the PR if an
      # admin enabled "Allow GitHub Actions to create and approve pull
      # requests", and its PRs run no CI.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SNAPSHOT_PR_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: AstarVienna/METIS_Pipeline
          path: upstream/METIS_Pipeline

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install MTR
        run: pip install -e .

      - name: Read the pinned irdb release
        id: irdb
        run: python -c "from metis_test_runner.run_metis import IRDB_RELEASES as r; print(f'tag=METIS.{r[\"METIS\"]}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: AstarVienna/irdb
          ref: ${{ steps.irdb.outputs.tag }}
          path: upstream/irdb
          sparse-checkout: METIS

      - name: Compare with the bundled snapshot
        id: check
        run: |
          # --check ignores pipeline_commit, so a mere upstream commit opens no PR.
          if python -m metis_test_runner.upstream --check upstream/METIS_Pipeline upstream/irdb 2> drift.txt; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            cat drift.txt
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        id: pr
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN || github.token }}
        run: |
          python -m metis_test_runner.upstream upstream/METIS_Pipeline upstream/irdb
          commit=$(python -c "import json; print(json.load(open('$SNAPSHOT'))['pipeline_commit'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "$SNAPSHOT"
          git commit -m "Refresh upstream snapshot (METIS_Pipeline $commit)"
          git push --force origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "METIS_Pipeline \`$commit\` changed the workflow tables MTR bundles for the"
            echo "\`docker\` / \`podman\` runners:"
            echo
            grep 'differs from upstream' drift.txt | sed 's/^.*: \(.*\) differs.*/- `\1`/'
            echo
            echo "This PR merges itself once its Unit Tests pass. A change here can change"
            echo "which task MTR sends data to; if they fail, review the diff by hand."
          } > body.md
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file body.md \
              --title "Refresh upstream snapshot (METIS_Pipeline $commit)"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "Refresh upstream snapshot (METIS_Pipeline $commit)" --body-file body.md
          fi

      # main has no required checks, so `gh pr merge --auto` would not wait for CI.
      # Watch the PR's own Unit Tests run for this exact commit instead.
      - name: Merge once the PR's tests pass
        if: steps.check.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.SNAPSHOT_PR_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.SNAPSHOT_PR_TOKEN != '' }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::notice::No SNAPSHOT_PR_TOKEN, so the PR runs no CI; leaving it for review."
            exit 0
          fi
          run=
          for _ in $(seq 40); do
            run=$(gh run list --commit "$SHA" --workflow unit_tests.yaml --event pull_request \
              --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
            sleep 15
          done
          if [ -z "$run" ]; then
            echo "::error::Unit Tests never started for $SHA; leaving the PR for review."
            exit 1
          fi
          gh run watch "$run" --exit-status --interval 30
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$SHA"
